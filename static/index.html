<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>JUNU Music Player</title>
  <style>
    @font-face {
      font-family: 'normal';
      src: url('/file/正酷超级黑.ttf');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    #background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      object-fit: cover;
      /*transition: 0.5s ease;*/ /* 添加过渡效果 */
    }

    #controls {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      z-index: 5;
    }

    #songTitle {
      position: absolute;
      bottom: -60px;
      left: 20px;
      font-size: 64px;
      font-weight: bold;
      width: 60%;
    }

    #center {
      top: 40%;
      left: 10%;
      display: flex;
      flex-direction: column;
      width: 80%;
    }

    #info{
      display: flex;
      justify-content: space-between;
    }

    #composer {
      font-size: 40px;
      font-weight: bold;
      line-height: 0;
    }

    #currentTime{
      font-size: 40px;
      font-weight: bold;
      line-height: 0;
    }

    #visualizer {
      height: 10%;
      display: flex;
      justify-content: space-around;
    }

    .visualizer-bar {
      width: 2px;
      height: 0;
      background-color: white;
    }

    .normal {
      font-family: 'normal';
    }

    .progressBar {
      width: 100%;
      height: 10px;
      background-color: #EEEEEE;
      cursor: pointer; /* 鼠标悬停时显示指针 */
      position: relative;
      border-radius: 5px;
    }

    .progress {
        height: 100%;
        background-color: #CACACA;
        position: absolute;
        left: 0;
        width: 0;
        border-radius: 5px;
    }

    #all {
      display: flex;;
      width: 100vw;
      height: 100vh;
    }

    #center{
      position: absolute;
    }

    #music_area {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      transition: 1s ease;
      text-shadow: black 2px 2px 5px;
      background: rgba(0, 0, 0, 0.025);
    }

    #SidebarButton {
      position: fixed;
      left: 20px;
      top: 20px;
      z-index: 5;
      border-radius: 7px;
      transition: 1s ease;
    }

    .menu{
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: 1s ease;
      box-shadow: black inset -20px 0 20px -20px;
      background-color: white;
    }

    .scroll-wrap {
      /* Thanks https://zhuanlan.zhihu.com/p/431956735 */
      max-width: 100%;
      display: inline-block;
      vertical-align: top;
      overflow: hidden;
      white-space: nowrap;
    }

    .scroll-item {
        animation: scroll linear 4s alternate infinite;
        float: left;
    }

    @keyframes scroll {
        0% {
            margin-left: 0;
            transform: translateX(0);
        }

        10% {
            margin-left: 0;
            transform: translateX(0);
        }

        90% {
            margin-left: 100%;
            transform: translateX(-100%);
        }

        100% {
            margin-left: 100%;
            transform: translateX(-100%);
        }
    }

    #VolumeControl {
      width: 40%;
      display: flex;
      justify-content: center;
      flex-direction: row;
      transition: 0.5s ease-out;
      margin: 10px;
    }

    #VolumeControl:hover {
      width: 80%;
    }

    #VprogressBar{
      width: 80%;
      margin: 10px;
    }

    .LeftText{
      color: black;
      font-size: 15px;
      font-weight: bold;
    }

    .LeftName{
      width: 40%;
    }

    #LeftControl{
      width: 80%;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }

    #TprogressBar{
      width: 80%;
    }

    .Tool{
      width: 70%;
      display: flex;
      align-items: center;
      flex-direction: row;
      justify-content: space-between;
      margin: 10px;
    }

    .List {
      height: 75%;
      width: 80%;
      overflow: auto;
    }

    .MusicBox{
      color: black;
      font-size: 30px;
      font-weight: bold;
      border-bottom: #C1C1C1 2px solid;
    }

    .MusicItem{
      margin-top: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    #controls img {
      margin: 10px;
    }

    #effects {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
    }

    #Show{
      font-size: 32px;
      position: absolute;
      display: flex;
      width: 100%;
      justify-content: center;
      text-align: center;
      top: 5%;
      transition: 0.5s ease;
      opacity: 0;
    }

    #tip{
      color: black;
      font-size: 30px;
      position: fixed;
      right: 20px;
      text-align: right;
      /*text-shadow: #999999 5px 5px 5px;*/
    }

    .pointer{
      cursor: pointer;
    }
    
    .search-box {
        width: 75%;
        padding: 10px;
        font-size: 16px;
        border: 2px solid #a7a7a7;
        border-radius: 5px;
    }

    #album_menu{
      height: 80%;
      width: 100%;
      position: fixed;
      box-shadow: black 0px 20px 20px -10px, black inset -20px 0 20px -20px;
      border-bottom-left-radius: 25px;
      border-bottom-right-radius: 25px;
      transition: 1s cubic-bezier(0, 0, 0.2, 1);
      transform: translateY(-120%);
    }

    #MV{
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 3;
    }
  </style>

    <script>
      let allowed = false;
      let BarOpened = false;
      let AlbumMenuOpened = false;
      let PlayMode = "Sequential";
      const audioContext = new (window.AudioContext ||
        window.webkitAudioContext)();
      let currentSongIndex = -1;
      let currentAlbum = "all";
      var audio = new Audio();
      let songList = [];
      let all_albums = {};
      let playHistory = []; // 播放历史记录
      let historyIndex = -1; // 当前在历史记录中的位置

      const prevButton = document.getElementById("prevButton");
      const playPauseButton = document.getElementById("playPauseButton");
      const nextButton = document.getElementById("nextButton");
      const songTitle = document.getElementById("songTitle");
      const composer = document.getElementById("composer");
      const background = document.getElementById("background");
      const visualizer = document.getElementById("visualizer");
      const currentTime = document.getElementById("currentTime");
      const SidebarButton = document.getElementById("SidebarButton");
      const menu = document.getElementById("menu");
      const music_area = document.getElementById("music_area");
      const TprogressBar = document.getElementById("TprogressBar");
      const Tprogress = document.getElementById("Tprogress");
      const VprogressBar = document.getElementById("VprogressBar");
      const Vprogress = document.getElementById("Vprogress");
      const ShowName = document.getElementById("ShowName");
      const MusicTime = document.getElementById("MusicTime");
      const volume_x = document.getElementById("volume-x");
      const volume_2 = document.getElementById("volume-2");
      const playMode = document.getElementById("playMode");
      const SongList = document.getElementById("SongList");
      const Tip = document.getElementById("Tip");
      const PiP = document.getElementById("PiP");//画中画
      const effects = document.getElementById("effects");
      const MArea = document.getElementById("music_area");
      const Area = document.getElementById("area");
      const Show = document.getElementById("Show");
      const album_menu = document.getElementById("album_menu");
      const Back = document.getElementById("Back");
      const albumList = document.getElementById("AlbumList");
      const song_searchBox = document.getElementById("song_search-box");
      const album_searchBox = document.getElementById("album_search-box");
      const openAlbumMenu = document.getElementById("openAlbumMenu");

      var PiPNow = false
      let pipWindow
      var VolumeTipTimeOut
      
      let isMouseOver = false;

      let loading = false;

      // Fetch initial song list and play the first song
      /*
      fetch("/list")
        .then((response) => response.json())
        .then((data) => {
          songList = data;
          loadSong(songList[currentSongIndex].num);
        })
        .catch((error) =>
          console.error("Failed to fetch initial song list:", error)
        );
      已废弃
      */
      /*
      fetch("/all_information_of_music")
        .then((response) => response.json())
        .then((data) => {
          songList = data;
          loadSong(songList[currentSongIndex].num);
          for (let i = 0; i < songList.length; i++) {
            Item=document.createElement("div")
            Item.classList=["MusicBox"]
            Item.innerHTML = `<div class="MusicItem scroll-wrap"><div class="normal scroll-item ">${songList[i].name} - ${songList[i].musician}</div></div>`;//JS 报错的小曲 - JUNU
            Item.addEventListener("click", function () {
              currentSongIndex = i
              loadSong(songList[currentSongIndex].num);
            });
            SongList.appendChild(Item);
          }
        })
        .catch((error) =>
          console.error("Failed to fetch initial song list:", error)
        );
      已废弃
      */

      function renderSongList(song_list) {
        console.log(song_list)
        SongList.innerHTML=""
        for (let i = 0; i < song_list.length; i++) {
          Item=document.createElement("div")
          Item.classList=["MusicBox"]
          Item.innerHTML = `<div class="MusicItem scroll-wrap"><div class="normal scroll-item ">${song_list[i].name} - ${song_list[i].musician}</div></div>`;//JS 报错的小曲 - JUNU
          Item.addEventListener("click", function () {
            // 找到当前歌曲在原始songList中的索引
            currentSongIndex = songList.findIndex(song => song.num === song_list[i].num);
            loadSong(song_list[i].num);
          });
          SongList.appendChild(Item);
        }
      }
      
      function loadAlbum(albumNum) {
        fetch(`/album/${albumNum}`)
          .then((response) => response.json())
          .then((data) => {
            setCookie();
            songList = data.songs;
            if (currentSongIndex == -1) {
              currentSongIndex = 0;
              loadSong(songList[currentSongIndex].num);
            }
            renderSongList(songList);
            playHistory = []
            historyIndex = -1;
          })
          .catch((error) =>
            console.error("Failed to fetch initial song list:", error)
          );
      }
      //loadAlbum("all");

      function loadSong(songNum) {
        fetch(`/name/${songNum}`)
          .then((response) => response.text())
          .then((name) => {
            songTitle.textContent = name.substring(1, name.length - 1);
            ShowName.textContent = name.substring(1, name.length - 1);
          })
          .catch((error) => console.error("Failed to fetch song name:", error));

        /*fetch(`/musician/${songNum}`)
          .then((response) => response.text())
          .then((artist) => {
            composer.textContent = artist.substring(1, artist.length - 1);
          })
          .catch((error) =>
            console.error("Failed to fetch artist name:", error)
          );*/
        composer.textContent = songList.find(
          (obj) => obj.num == songNum
        ).musician;

        loading = true;
        fetch(`/photo/${songNum}?${Math.random()}`)
          .then((response) => {
            if (response.ok) {
              return response.blob();
            } else {
              throw new Error("Failed to fetch photo");
            }
          })
          .then((blob) => {
            const url = URL.createObjectURL(blob);
            background.style.transition = "0.5s ease";
            background.style.opacity = "0"; // 设置不透明度为0，开始渐变
            background.style.transform = "scale(1.5)";
            setTimeout(() => {
              background.src = url; // 更改图片源
              background.style.opacity = "1"; // 设置不透明度为1，结束渐变
              background.style.transform = "scale(1)";
              background.style.transition = "0.5s";
              loading = false;
            }, 500); // 等待0.5秒，与过渡效果时间一致
          })
          .catch((error) => console.error("Failed to fetch photo:", error));
        audio.src = `/music/${songNum}`;
        if (allowed) {
          console.info("allowed");
          audio.play(); //避免该死的"The AudioContext was not allowed to start. It must be resumed (or created) after a user gesture on the page."
          playPauseButton.src = "/icon/pause.svg";
        }
      }

      function togglePlayPause() {
        allowed = true;

        if (audio.paused) {
          audioContext.resume().then(() => {
            audio.play();
            playPauseButton.src = "/icon/pause.svg";
          });
        } else {
          audio.pause();
          playPauseButton.src = "/icon/play.svg";
        }
      }

      function playNextSong(auto = false) {
        // 更新历史记录
        if (currentSongIndex !== -1 && historyIndex < playHistory.length - 1) {
          // 如果当前不在历史记录的最后，截断历史记录
          // playHistory = playHistory.slice(0, historyIndex + 1);
          historyIndex++;
          currentSongIndex = playHistory[historyIndex];
          loadSong(songList[currentSongIndex].num);
          return;
        }
        else{
          if (PlayMode == "Loop" && auto) {
            currentSongIndex = currentSongIndex;
          } else if (PlayMode == "Random") {
            NextSongIndex = Math.floor(Math.random() * songList.length);
            while (currentSongIndex == NextSongIndex && songList.length > 1) {
              NextSongIndex = Math.floor(Math.random() * songList.length);
            }
            currentSongIndex = NextSongIndex;
          } else {
            currentSongIndex = (currentSongIndex + 1) % songList.length;
          }
          playHistory.push(currentSongIndex);
          // 若播放历史列表长度超过100，删除最前面的元素
          if (playHistory.length > 100) {
            playHistory.shift();
            historyIndex--;
          }
          historyIndex = playHistory.length - 1;
        }
        console.log(playHistory, historyIndex);

        loadSong(songList[currentSongIndex].num);
      }

      function playPrevSong() {
        // 从历史记录中获取上一首歌曲
        if (historyIndex > 0) {
          historyIndex--;
          currentSongIndex = playHistory[historyIndex];
          console.log(playHistory, historyIndex);
        } else {
          // 如果没有上一首歌曲，根据播放模式选择上一首
          if (PlayMode == "Loop") {
            currentSongIndex = currentSongIndex;
          } else if (PlayMode == "Random") {
            NextSongIndex = Math.floor(Math.random() * songList.length);
            while (currentSongIndex == NextSongIndex && songList.length > 1) {
              NextSongIndex = Math.floor(Math.random() * songList.length);
            }
            currentSongIndex = NextSongIndex;
          } else {
            currentSongIndex = currentSongIndex - 1;
          }
          if (currentSongIndex < 0) currentSongIndex = songList.length - 1;
        }
        loadSong(songList[currentSongIndex].num);
      }

      function openURL() {
        console.info(songList[currentSongIndex].URL);
        if (songList[currentSongIndex].URL == "None") {
          ShowInfo("该歌曲未存储地址");
        }
        else {
          window.open(songList[currentSongIndex].URL, '_blank', 'noopener,noreferrer');
        }
      }

      const analyser = audioContext.createAnalyser();
      const gainNode = audioContext.createGain();
      const context = visualizer.getContext("2d");
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      function updateVisualizer() {

        const source = audioContext.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(gainNode);
        gainNode.connect(audioContext.destination);

        analyser.fftSize = 512;
        
        var effect1=true;
        var effect2=true;

        var all = 360

        //var last_VH = 0
        function draw() {
          
          if (PiPNow){
            var num = 125;
          }
          else{
            var num = 250;
          }
          const visualizerWidth = visualizer.offsetWidth;
          visualizer.width = visualizerWidth;
          analyser.getByteFrequencyData(dataArray);
          context.clearRect(0, 0, visualizer.width, visualizer.height);

          if (visualizerWidth / num < 4.5){
            var num = Math.floor(visualizerWidth/4.5)
          }
          if (visualizerWidth / num > 6){
            var num = Math.floor(visualizerWidth/6)
          }

          const barWidth = visualizerWidth / num;
          const shadow = barWidth / 3;
          //console.log("barWidth:", barWidth, visualizer.width);

          var now_VH=0
          var max_VH=0
          for (let i = 0; i <= all; i++) {
            now_VH += dataArray[i]
            max_VH = Math.max(max_VH,dataArray[i])
          }
          var VH=20000
          if(!loading){
            if(now_VH>VH/* && !PiPNow*/){
            console.info("high",now_VH)
            if(effect1){effects.style["box-shadow"] = `inset white 0px 0px 50px ${(now_VH-25000)*0.01}px`;}
            if(effect2){background.style.transition = "0.01s";
                        background.style.transform = `scale(${1+(now_VH-VH)/50000})`;}
            }
            else{
              if(effect1){effects.style["box-shadow"] = `inset white 0px 0px 0px 0px`;}
              if(effect2){background.style.transition = "0.5s";
                          background.style.transform = `scale(1)`;}
            }
          }
          /*
          if(now_VH-last_VH>1000){
            console.info("boom",now_VH-last_VH)
            background.style.transition = "0.01s";
            background.style.transform = `scale(${1+(now_VH-last_VH-1000)/10000})`;
          }
          else{
            background.style.transition = "0.5s";
            background.style.transform = `scale(1)`;
          }
          */
          //last_VH=now_VH

          for (let i = 0; i <= num; i++) {
            if (PiPNow){
              var h = dataArray[i] * 0.2;
            }
            else{
              var h = dataArray[i] * 0.5;
            }
            const barHeight = h
            context.fillStyle = "black";
            context.fillRect(
              i * barWidth,
              0 /*visualizer.height - (barHeight + 3)*/,
              barWidth * 0.9 + shadow,
              barHeight + 3 + shadow
            );
            context.fillStyle = "white";
            context.fillRect(
              i * barWidth,
              0 /*visualizer.height - (barHeight + 3)*/,
              barWidth * 0.9,
              barHeight + 3
            );
          }
          requestAnimationFrame(draw);
        }
        draw();
      }
      updateVisualizer();

      var ShowTipTimeOut;

      function ShowInfo(info) {
        Show.innerText = info;
        Show.style.opacity = "1";
        clearTimeout(ShowTipTimeOut);
        ShowTipTimeOut = setTimeout(() => {
          Show.style.opacity = "0";
        },1000)
      }

      function setVolume(volume) {
        gainNode.gain.value = volume;
        var percentage = gainNode.gain.value * 100;
        Vprogress.style.width = percentage + "%";
        ShowInfo(Math.round(percentage) + "%");
        
        setCookie()
      }

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60)
          .toString()
          .padStart(2, "0");
        const secs = Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");
        return `${minutes}:${secs}`;
      }

      var MenuWidth = "250px";
      menu.style.width = MenuWidth;
      menu.style.transform = `translateX(-${MenuWidth})`; //初始化

      function OpenSidebar() {
        if (BarOpened) {
          BarOpened = false;
          menu.style.transform = `translateX(-${MenuWidth})`;
          music_area.style.left = "0";
          SidebarButton.style["background-color"] = "rgba(160, 160, 160, 0)";
          Tip.style.opacity = "0";
        } else {
          BarOpened = true;
          menu.style.transform = "translateX(0px)";
          if (!PiPNow){
            music_area.style.left = MenuWidth;
          }
          SidebarButton.style["background-color"] = "rgba(160, 160, 160, 0.5)";
          Tip.style.opacity = "1";
        }
      }

      function renderAlbumList(albums) {
        albumList.innerHTML = '';
        for (const [id, name] of Object.entries(albums)) {
            Item=document.createElement("div")
            Item.classList=["MusicBox"]
            Item.innerHTML = `<div class="MusicItem scroll-wrap"><div class="normal scroll-item ">${name}</div></div>`;
            Item.addEventListener("click", () => {
                currentAlbum = id;
                loadAlbum(id);
                if (AlbumMenuOpened){
                  OpenAlbumMenu();
                }
            });
            albumList.appendChild(Item);
        }
      }

      async function showAlbums() {
        try {
          const response = await fetch('/all_albums');
          const data = await response.json();
          all_albums = data;
          renderAlbumList(all_albums);
        } catch (error) {
          console.error('加载专辑失败:', error);
        }
      }

      function OpenAlbumMenu() {
        if (AlbumMenuOpened) {
          AlbumMenuOpened = false;
          album_menu.style.transform = "translateY(-120%)";
        } else {
          AlbumMenuOpened = true;
          if(!BarOpened){
            OpenSidebar();
            setTimeout(() => {
              showAlbums();
              album_menu.style.transform = "translateY(0px)";
            }, 500);
          } else {
            showAlbums();
            album_menu.style.transform = "translateY(0px)";
          }
        }
      }

      async function searchAlbums(query) {
          query = query.toLowerCase();
          const filteredAlbums = {};

          for (const [id, name] of Object.entries(all_albums)) {
              if (name.toLowerCase().includes(query)) {
                  filteredAlbums[id] = name;
              }
          }

          renderAlbumList(filteredAlbums);
      }
      album_searchBox.addEventListener('input', e => searchAlbums(e.target.value));

      async function searchSongs(query) {
          query = query.toLowerCase();
          const filteredSongs = [];
          count = 0;

          for (const [id, song] of Object.entries(songList)) {
              if (song.name.toLowerCase().includes(query) || song.musician.toLowerCase().includes(query)) {
                  filteredSongs[count++] = song;
              }
          }
          console.log(filteredSongs);

          renderSongList(filteredSongs);
      }
      song_searchBox.addEventListener('input', e => searchSongs(e.target.value));

      // 更新进度条
      audio.addEventListener("timeupdate", function () {
        var percentage = (audio.currentTime / audio.duration) * 100;
        Tprogress.style.width = percentage + "%";
      });

      // 拖动进度条
      TprogressBar.addEventListener("mousedown", function (e) {
        document.addEventListener("mousemove", TonMouseMove);
        document.addEventListener("mouseup", TonMouseUp);
      });

      function TonMouseMove(e) {
        var TprogressBarRect = TprogressBar.getBoundingClientRect();
        var clickPosition = e.clientX - TprogressBarRect.left;
        var newTime = (clickPosition / TprogressBarRect.width) * audio.duration;
        newTime = newTime.toFixed(2);
        audio.currentTime = newTime;
        console.log(newTime, audio.duration);
      }

      function TonMouseUp() {
        document.removeEventListener("mousemove", TonMouseMove);
        document.removeEventListener("mouseup", TonMouseUp);
      }

      Vprogress.style.width="100%"

      // 拖动音量条
      VprogressBar.addEventListener("mousedown", function (e) {
        document.addEventListener("mousemove", VonMouseMove);
        document.addEventListener("mouseup", VonMouseUp);
      });

      function VonMouseMove(e) {
        var VprogressBarRect = VprogressBar.getBoundingClientRect();
        var clickPosition = e.clientX - VprogressBarRect.left;
        var newVolume = clickPosition / VprogressBarRect.width;
        if (newVolume < 0) newVolume = 0;
        if (newVolume > 1) newVolume = 1;
        setVolume(newVolume);
      }

      function VonMouseUp() {
        document.removeEventListener("mousemove", VonMouseMove);
        document.removeEventListener("mouseup", VonMouseUp);
      }

      // 获取Cookie值
      function getCookie() {
        let cookieArray = document.cookie.split('; ');
        let cookiePair;
        setVolume(1);
        for (let i = 0; i < cookieArray.length; i++) {
          cookiePair = cookieArray[i].split('=');
          if (cookiePair[0] === "Volume") {
            setVolume(decodeURIComponent(cookiePair[1])/100);
            console.log("Volume: ",decodeURIComponent(cookiePair[1])/100);
          }
          if (cookiePair[0] === "CurrentAlbum") {
            currentAlbum = decodeURIComponent(cookiePair[1]);
            loadAlbum(currentAlbum);
          }
        }
      }

      getCookie()

      // 设置Cookie值
      function setCookie() {
        // 更新Cookie
        let expires = "";
        let date = new Date();
        date.setTime(date.getTime() + (2592000000));//一个月
        expires = "; expires=" + date.toUTCString();
        // 存储音量信息
        const volumeCookie = "Volume" + "=" + encodeURIComponent(Math.round(gainNode.gain.value * 100));
        // 存储当前专辑信息
        const currentAlbumCookie = "CurrentAlbum" + "=" + encodeURIComponent(currentAlbum);
        // 同时设置两个 cookie
        document.cookie = volumeCookie + expires + "; path=/";
        document.cookie = currentAlbumCookie + expires + "; path=/";
      }
      SidebarButton.addEventListener("click", OpenSidebar);
      Back.addEventListener("click", OpenAlbumMenu);
      openAlbumMenu.addEventListener("click", OpenAlbumMenu);

      playPauseButton.addEventListener("click", togglePlayPause);
      nextButton.addEventListener("click", () => playNextSong());
      prevButton.addEventListener("click", playPrevSong);
      audio.addEventListener("ended", () => playNextSong(true));

      audio.addEventListener("timeupdate", function () {
        currentTime.textContent = formatTime(audio.currentTime);
        MusicTime.textContent = `${formatTime(audio.currentTime)}/${formatTime(
          audio.duration
        )}`;
      });

      volume_x.addEventListener("click", function () {
        setVolume(0);
      });

      volume_2.addEventListener("click", function () {
        setVolume(1);
      });

      songTitle.addEventListener("click", function () {
        openURL();
      });

      function changePlayMode() {
        console.log(PlayMode);
        if (PlayMode == "Sequential") {
          console.info("顺序播放");
          PlayMode = "Loop"; //循环播放
          playMode.src = "/icon/repeat.svg";
        } else if (PlayMode == "Loop") {
          console.info("循环播放");
          PlayMode = "Random"; //随机播放
          playMode.src = "/icon/shuffle.svg";
        } else if (PlayMode == "Random") {
          console.info("随机播放");
          PlayMode = "Sequential"; //顺序播放
          playMode.src = "/icon/arrow-right.svg";
        }
        ShowInfo("播放模式: " + PlayMode);
      }

      playMode.addEventListener("click", function () {
        changePlayMode();
      });

      let isCoolDown = false;
      let CoolDownTime = 1000;
      
      function KeyDown (event) {
        // 检查当前焦点是否在搜索框中，如果是则不执行快捷键
        const activeElement = document.activeElement;
        if (activeElement === song_searchBox || activeElement === album_searchBox) {
          return;
        }
        console.log(event.code);
        switch (event.code) {
          case "KeyM":
            OpenSidebar();
            break;
          case "KeyE":
            OpenSidebar();
            break;
          case "KeyA":
            OpenAlbumMenu();
            break;
          case "KeyP":
            OpenPiP();
            break;
          case "KeyS":
            changePlayMode();
            break;
          case "Space":
            togglePlayPause();
            break;
          case "ArrowLeft":
            if (isCoolDown) {
              return;
            }
            // 设置冷却状态，并在0.5秒后重置
            isCoolDown = true;
            setTimeout(function () {
              isCoolDown = false;
            }, CoolDownTime);
            playPrevSong();
            break;
          case "ArrowRight":
            if (isCoolDown) {
              return;
            }
            // 设置冷却状态，并在0.5秒后重置
            isCoolDown = true;
            setTimeout(function () {
              isCoolDown = false;
            }, CoolDownTime);
            playNextSong();
            break;
          case "ArrowUp":
            var newVolume = gainNode.gain.value + 0.1;
            if (newVolume > 1) newVolume = 1;
            setVolume(newVolume);
            break;
          case "ArrowDown":
            var newVolume = gainNode.gain.value - 0.1;
            if (newVolume < 0) newVolume = 0;
            setVolume(newVolume);
            break;
          case "KeyL":
            openURL();
            break;
          default:
            break;
        }
      }

      function PiPKeyDown (event) {
        switch (event.code) {
          case "KeyM":
            window.focus();
            break;
          case "KeyE":
            window.focus();
            break;
          case "KeyA":
            window.focus();
            break;
          default:
            break;
        }
        KeyDown(event);
      }

      document.addEventListener("keydown", KeyDown);

      music_area.addEventListener("mouseenter", function() {
        isMouseOver = true;
        //console.log("鼠标进入元素");
      });

      music_area.addEventListener("mouseleave", function() {
        isMouseOver = false;
        //console.log("鼠标离开元素");
      });

      function wheel(event) {
        if (isMouseOver) {
          // 获取滚动量
          let deltaY = event.deltaY; // 垂直滚动量

          // 判断滚动方向
          if (deltaY > 0) {
            var newVolume = gainNode.gain.value - 0.01;
            if (newVolume < 0) newVolume = 0;
            setVolume(newVolume);
          } else if (deltaY < 0) {
            var newVolume = gainNode.gain.value + 0.01;
            if (newVolume > 1) newVolume = 1;
            setVolume(newVolume);
          }
        }
      }

      document.addEventListener('wheel', wheel);

      */

      var Style="\
        #songTitle{\
          bottom: -30px;\
          left: 10px;\
          font-size: 32px;\
        }\
        #composer{\
          font-size: 20px;\
        }\
        #currentTime{\
          font-size: 20px;\
        }\
        #controls {\
          bottom: 0px;\
        }\
        #controls img {\
          width: 32px;\
        }\
        #center {\
          top: 35%;\
        }\
      "

      async function OpenPiP(){
        if (PiPNow == false) {
          console.log("PiP start");
          PiPNow = true
          isMouseOver = false; // 假定鼠标离开小窗，避免音量意外调整
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          } else {
            pipWindow = await documentPictureInPicture.requestWindow({
              width: 480,
              height: 240,
              //disallowReturnToOpener: true,
              preferInitialWindowPlacement: true,
            });
            // 其中 width 和 height 是可选参数，用于指定画中画窗口的大小
            pipWindow.addEventListener("pagehide", (event) => {
              PiPNow = false
              document.body.style.background = "";
              Area.innerHTML='';
              Area.append(event.target.getElementById("music_area"));
              if (BarOpened) {
                music_area.style.left = MenuWidth;
              } else {
                music_area.style.left = "0";
              }
            });

            // Copy all style sheets.
            [...document.styleSheets].forEach((styleSheet) => {
                const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
                const style = document.createElement('style');

                style.textContent = cssRules;
                pipWindow.document.head.appendChild(style);
            });
            const StyleElement = document.createElement('style')
            StyleElement.textContent = Style;
            pipWindow.document.head.appendChild(StyleElement);
            music_area.style.left = "0";

            document.body.style.background = "#999999";

            pipWindow.document.body.append(MArea);
            Area.innerHTML='<p id="tip" class="normal">Picture-in-Picture (PiP) playback</p>';
            pipWindow.document.addEventListener("keydown", PiPKeyDown);
            pipWindow.document.addEventListener('wheel', wheel);
          }
          
        }
        else{
          pipWindow.close();
          console.log('Video left Picture-in-Picture mode.');
          window.focus();
        }
      }
      document.getElementById("PiP").addEventListener("click", function () {
        OpenPiP();
      });
    </script>
  </body>
