<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传歌曲</title>
    <style>
        @font-face {
            font-family: "normal";
            src: url("/file/正酷超级黑.ttf");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .upload-container {
            background-color: #2a2a2a;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-family: "normal", Arial, sans-serif;
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #e0e0e0;
            font-size: 16px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            background-color: #3a3a3a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: #4a4a4a;
            box-shadow: 0 0 0 2px rgba(0, 140, 186, 0.3);
        }

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background-color: #5a5a5a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            transition: background-color 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #7a7a7a;
        }

        .file-info {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }

        .upload-button {
            width: 100%;
            padding: 15px;
            background-color: #008cba;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .upload-button:hover {
            background-color: #006b8f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 140, 186, 0.3);
        }

        .upload-button:active {
            transform: translateY(0);
        }

        .upload-progress {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #3a3a3a;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background-color: #008cba;
            width: 0%;
            transition: width 0.3s ease;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #5a5a5a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .back-button:hover {
            background-color: #7a7a7a;
        }

        .form-section {
            border-top: 1px solid #3a3a3a;
            padding-top: 20px;
            margin-top: 20px;
        }

        .form-section:first-child {
            border-top: none;
            padding-top: 0;
            margin-top: 0;
        }

        @media (max-width: 600px) {
            .upload-container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-button">← 返回</a>
    
    <div class="upload-container">
        <h1>上传新歌曲</h1>
        
        <form action="/add_music" method="post" enctype="multipart/form-data" id="upload-form">
            <div class="form-section">
                <div class="form-group">
                    <label for="music_file">音乐文件</label>
                    <input type="file" name="music_file" required>
                </div>
                
                <div class="form-group">
                    <label for="image_file">封面图片</label>
                    <input type="file" name="image_file" required>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group">
                    <label for="song_name">歌曲名称</label>
                    <input type="text" name="song_name" placeholder="请输入歌曲名称" required>
                </div>
                
                <div class="form-group">
                    <label for="composer">作曲家/艺术家</label>
                    <input type="text" name="composer" placeholder="请输入作曲家或艺术家名称" required>
                </div>
            </div>
            
            <button type="submit" class="upload-button">上传歌曲</button>
        </form>
        
        <div class="upload-progress" id="upload-progress">
            <div>正在上传...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div id="upload-status">准备上传...</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('upload-form');
        const uploadProgress = document.getElementById('upload-progress');
        const progressFill = document.getElementById('progress-fill');
        const uploadStatus = document.getElementById('upload-status');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            const xhr = new XMLHttpRequest();
            
            uploadProgress.style.display = 'block';
            uploadStatus.textContent = '正在上传...';
            
            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressFill.style.width = percentComplete + '%';
                    uploadStatus.textContent = `已上传 ${Math.round(percentComplete)}%`;
                }
            });
            
            xhr.addEventListener('load', function() {
                if (xhr.status === 200) {
                    uploadStatus.textContent = '上传成功！';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    uploadStatus.textContent = '上传失败，请重试';
                }
            });
            
            xhr.addEventListener('error', function() {
                uploadStatus.textContent = '上传失败，请重试';
            });
            
            xhr.open('POST', '/add_music');
            xhr.send(formData);
        });

        // 文件选择提示
        document.querySelectorAll('input[type="file"]').forEach(input => {
            input.addEventListener('change', function(e) {
                const fileName = e.target.files[0]?.name || '';
                const fileInfo = e.target.nextElementSibling;
                if (fileName) {
                    fileInfo.textContent = `已选择: ${fileName}`;
                }
            });
        });
    </script>
</body>
</html>
